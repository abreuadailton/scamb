<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Scamb</title>
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/navigation.js" defer></script>
</head>
<body class="auth-page">

  <!-- NAVBAR -->
  <nav class="navbar" aria-label="Navegação principal">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">
        <span class="swap-mark" aria-hidden="true"></span>Scamb
      </a>
      <button type="button" class="navbar-toggle" id="navToggle" aria-label="Menu" aria-controls="navLinks" aria-expanded="false">
        <span class="menu-lines" aria-hidden="true"></span>
      </button>
      <ul class="navbar-links" id="navLinks">
        <li><a href="catalog.html"><i class="fas fa-th-large"></i> Catálogo</a></li>
        <li><a href="map.html"><i class="fas fa-map-marker-alt"></i> Pontos seguros</a></li>
        <li><a href="register.html" class="btn btn-primary btn-sm">Criar conta</a></li>
      </ul>
    </div>
  </nav>

  <main class="container auth-container">
    <aside class="auth-visual">
      <img src="img/scamb-hero.jpg" width="1448" height="1086" alt="">
      <a href="catalog.html">Explore o catálogo <i class="fas scamb-icon fa-arrow-right" aria-hidden="true"></i></a>
    </aside>
    <div class="auth-card">
      <div class="auth-header">
        <h1>Entre na sua conta</h1>
        <p>Acesse seus anúncios e acompanhe suas trocas.</p>
      </div>

      <div id="error-msg" role="alert" class="form-error" style="display:none; padding:12px; background:#fef2f2; color:#991b1b; border-radius:10px; margin-bottom:16px;"></div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email" style="font-weight:600; font-size:0.9rem; color:#334155;"><i class="fas fa-envelope"></i> E-mail</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password" style="font-weight:600; font-size:0.9rem; color:#334155;"><i class="fas fa-lock"></i> Senha</label>
          <div class="input-password-wrap" style="position:relative;">
            <input type="password" id="password" name="password" class="form-control" placeholder="Sua senha" autocomplete="current-password" required>
            <button type="button" aria-label="Mostrar ou ocultar senha" class="toggle-password" onclick="togglePass()" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#94a3b8; cursor:pointer;">
              <i class="fas scamb-icon fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
          <span id="btnText"><i class="fas fa-sign-in-alt"></i> Entrar</span>
          <span id="btnLoading" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Entrando...</span>
        </button>
      </form>

      <div class="demo-accounts">
        <p>Contas de demonstração</p>
        <div class="demo-actions">
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('ana@scamb.com')">Ana</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('carlos@scamb.com')">Carlos</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('mariana@scamb.com')">Mariana</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('lucas@scamb.com')">Lucas</button>
        </div>
      </div>

      <div class="auth-footer" style="text-align:center; margin-top:20px;">
        <p style="font-size:0.9rem; color:#64748b;">
          Ainda não tem conta? <a href="register.html" style="font-weight:700; color:var(--color-primary);">Cadastre-se grátis</a>
        </p>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = location.protocol === 'file:' ? 'http://localhost:3001/api' : '/api';

    function quickFill(email) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = 'senha123';
    }

    function togglePass() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'fas scamb-icon fa-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'fas scamb-icon fa-eye';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function setLoading(state) {
      document.getElementById('btnText').style.display = state ? 'none' : 'inline';
      document.getElementById('btnLoading').style.display = state ? 'inline' : 'none';
      document.getElementById('submitBtn').disabled = state;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('error-msg').style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      setLoading(true);

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('scamb_token', data.token);
          localStorage.setItem('scamb_user', JSON.stringify(data.user));
          localStorage.setItem('swaply_token', data.token);
          localStorage.setItem('swaply_user', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          showError(data.error || 'Email ou senha inválidos.');
          setLoading(false);
        }
      } catch (err) {
        showError('Erro de conexão. Verifique se o servidor está rodando.');
        setLoading(false);
      }
    });
  </script>

  <footer class="site-footer">
    <div class="container site-footer-inner">
      <a href="index.html" class="site-footer-brand"><span class="swap-mark" aria-hidden="true"></span>Scamb</a>
      <nav aria-label="Rodapé">
        <a href="catalog.html">Catálogo</a>
        <a href="map.html">Pontos seguros</a>
      </nav>
      <small>© 2026 Scamb · Feito por Felipe Gomes e José Adailton</small>
    </div>
  </footer>
</body>
</html>
