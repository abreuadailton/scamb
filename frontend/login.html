<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — EcoPermuta</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="navbar-logo">
        <i class="fas fa-leaf"></i> EcoPermuta
      </a>
      <button class="navbar-toggle" id="navToggle" aria-label="Menu">
        <i class="fas fa-bars"></i>
      </button>
      <ul class="navbar-links" id="navLinks">
        <li><a href="catalog.html"><i class="fas fa-th"></i> Catálogo</a></li>
        <li><a href="map.html"><i class="fas fa-map-marker-alt"></i> Mapa</a></li>
        <li><a href="register.html" class="btn btn-primary btn-sm">Cadastrar</a></li>
      </ul>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">
          <i class="fas fa-leaf"></i>
        </div>
        <h1>Bem-vindo de volta!</h1>
        <p>Entre na sua conta EcoPermuta</p>
      </div>

      <div id="error-msg" class="form-error" style="display:none;"></div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> E-mail</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="seu@email.com" required autofocus>
        </div>
        <div class="form-group">
          <label for="password"><i class="fas fa-lock"></i> Senha</label>
          <div class="input-password-wrap">
            <input type="password" id="password" name="password" class="form-control" placeholder="Sua senha" required>
            <button type="button" class="toggle-password" onclick="togglePass()">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
          <span id="btnText"><i class="fas fa-sign-in-alt"></i> Entrar</span>
          <span id="btnLoading" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Entrando...</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Não tem conta? <a href="register.html">Cadastre-se grátis</a></p>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = 'http://localhost:3001/api';
    function getToken() { return localStorage.getItem('ecopermuta_token'); }
    function authHeaders() { return { headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' } }; }

    // Redireciona se já logado
    if (getToken()) window.location.href = 'dashboard.html';

    document.getElementById('navToggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('open');
    });

    function togglePass() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function setLoading(state) {
      document.getElementById('btnText').style.display = state ? 'none' : 'inline';
      document.getElementById('btnLoading').style.display = state ? 'inline' : 'none';
      document.getElementById('submitBtn').disabled = state;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('error-msg').style.display = 'none';
      setLoading(true);

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('ecopermuta_token', data.token);
          localStorage.setItem('ecopermuta_user', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          showError(data.error || 'Email ou senha inválidos.');
          setLoading(false);
        }
      } catch (err) {
        showError('Erro de conexão. Verifique se o servidor está rodando.');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
