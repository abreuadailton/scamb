<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Pontos de Troca — EcoPermuta</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="navbar-logo"><i class="fas fa-leaf"></i> EcoPermuta</a>
      <button class="navbar-toggle" id="navToggle"><i class="fas fa-bars"></i></button>
      <ul class="navbar-links" id="navLinks">
        <li><a href="catalog.html"><i class="fas fa-th"></i> Catálogo</a></li>
        <li><a href="map.html" class="active"><i class="fas fa-map-marker-alt"></i> Mapa</a></li>
        <li id="nav-guest"><a href="login.html" class="btn btn-secondary btn-sm">Entrar</a></li>
        <li id="nav-user" style="display:none;"><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
        <li id="nav-logout" style="display:none;"><a href="#" onclick="logout()" class="btn btn-secondary btn-sm">Sair</a></li>
      </ul>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1><i class="fas fa-map"></i> Mapa de Pontos de Troca</h1>
      <p>Encontre pontos seguros para realizar suas trocas em São Paulo</p>
    </div>
  </div>

  <main class="container map-main">

    <!-- CONTROLES -->
    <div class="map-controls">
      <button class="btn btn-primary btn-sm" onclick="centerOnMe()">
        <i class="fas fa-crosshairs"></i> Minha localização
      </button>
      <div class="map-legend">
        <span class="legend-item"><span class="legend-dot legend-dot--green"></span> Pontos de troca</span>
        <span class="legend-item" id="legend-items" style="display:none;"><span class="legend-dot legend-dot--blue"></span> Itens disponíveis</span>
      </div>
    </div>

    <!-- MAPA -->
    <div id="map"></div>

    <!-- INFO -->
    <div class="map-info-row">
      <div class="card map-info-card">
        <i class="fas fa-info-circle"></i>
        <p>Clique em um ponto no mapa para ver detalhes e usá-lo como ponto de encontro em uma troca.</p>
      </div>
    </div>

  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_BASE = 'http://localhost:3001/api';
    function getToken() { return localStorage.getItem('ecopermuta_token'); }
    function authHeaders() { return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }; }

    // Navbar
    if (getToken()) {
      document.getElementById('nav-guest').style.display = 'none';
      document.getElementById('nav-user').style.display = 'list-item';
      document.getElementById('nav-logout').style.display = 'list-item';
    }
    document.getElementById('navToggle').addEventListener('click', () => { document.getElementById('navLinks').classList.toggle('open'); });
    function logout() { localStorage.removeItem('ecopermuta_token'); localStorage.removeItem('ecopermuta_user'); window.location.reload(); }

    // Inicializa mapa centrado em SP
    const map = L.map('map').setView([-23.55, -46.63], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>',
      maxZoom: 19
    }).addTo(map);

    // Ícones customizados
    const greenIcon = L.divIcon({
      className: '',
      html: '<div style="background:#2D7D32;width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -34]
    });

    const blueIcon = L.divIcon({
      className: '',
      html: '<div style="background:#1976D2;width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;"><i class=\'fas fa-box\' style=\'color:#fff;font-size:12px;\'></i></div>',
      iconSize: [28, 28],
      iconAnchor: [14, 14],
      popupAnchor: [0, -16]
    });

    const myIcon = L.divIcon({
      className: '',
      html: '<div style="background:#FFC107;width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    async function loadExchangePoints() {
      try {
        const res = await fetch(`${API_BASE}/exchange-points`);
        if (!res.ok) return;
        const points = await res.json();
        points.forEach(pt => {
          if (!pt.latitude || !pt.longitude) return;
          const marker = L.marker([pt.latitude, pt.longitude], { icon: greenIcon }).addTo(map);
          marker.bindPopup(`
            <div class="map-popup">
              <h3><i class="fas fa-map-marker-alt" style="color:#2D7D32"></i> ${pt.name}</h3>
              ${pt.address ? `<p><i class="fas fa-road"></i> ${pt.address}</p>` : ''}
              ${pt.schedule ? `<p><i class="fas fa-clock"></i> ${pt.schedule}</p>` : ''}
              ${pt.description ? `<p>${pt.description}</p>` : ''}
              <a href="trades.html" style="color:#2D7D32;font-weight:600;"><i class="fas fa-handshake"></i> Usar como ponto de encontro</a>
            </div>
          `);
        });
      } catch(e) {}
    }

    async function loadItemMarkers() {
      if (!getToken()) return;
      try {
        const res = await fetch(`${API_BASE}/items`);
        if (!res.ok) return;
        const items = await res.json();
        const hasItems = items.some(i => i.latitude && i.longitude);
        if (hasItems) document.getElementById('legend-items').style.display = 'flex';
        items.forEach(item => {
          if (!item.latitude || !item.longitude) return;
          const marker = L.marker([item.latitude, item.longitude], { icon: blueIcon }).addTo(map);
          marker.bindPopup(`
            <div class="map-popup">
              <h3>${item.title}</h3>
              <p><span class="badge badge-category">${item.category||'Geral'}</span></p>
              <p><i class="fas fa-user"></i> ${item.owner_name||'Usuário'}</p>
              <a href="item-detail.html?id=${item.id}" style="color:#1976D2;font-weight:600;"><i class="fas fa-eye"></i> Ver detalhes</a>
            </div>
          `);
        });
      } catch(e) {}
    }

    let myMarker = null;
    function centerOnMe() {
      if (!navigator.geolocation) { alert('Geolocalização não suportada pelo seu navegador.'); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const latlng = [pos.coords.latitude, pos.coords.longitude];
          map.setView(latlng, 15);
          if (myMarker) map.removeLayer(myMarker);
          myMarker = L.marker(latlng, { icon: myIcon }).addTo(map);
          myMarker.bindPopup('<b>Você está aqui</b>').openPopup();
        },
        () => { alert('Não foi possível obter sua localização.'); }
      );
    }

    loadExchangePoints();
    loadItemMarkers();
  </script>
</body>
</html>
