<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — EcoPermuta</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="navbar-logo">
        <i class="fas fa-leaf"></i> EcoPermuta
      </a>
      <button class="navbar-toggle" id="navToggle" aria-label="Menu">
        <i class="fas fa-bars"></i>
      </button>
      <ul class="navbar-links" id="navLinks">
        <li><a href="catalog.html"><i class="fas fa-th"></i> Catálogo</a></li>
        <li><a href="map.html"><i class="fas fa-map-marker-alt"></i> Mapa</a></li>
        <li><a href="my-items.html"><i class="fas fa-box"></i> Meus Itens</a></li>
        <li><a href="trades.html"><i class="fas fa-handshake"></i> Trocas</a></li>
        <li><a href="profile.html"><i class="fas fa-user"></i> Perfil</a></li>
        <li><a href="#" onclick="logout()" class="btn btn-secondary btn-sm">Sair</a></li>
      </ul>
    </div>
  </nav>

  <main class="container dashboard-main">

    <!-- HEADER USUÁRIO -->
    <div class="dashboard-header" id="dashboardHeader">
      <div class="user-greeting">
        <div class="user-avatar" id="userAvatar">
          <i class="fas fa-user"></i>
        </div>
        <div class="user-info">
          <h1>Olá, <span id="userName">...</span>! 👋</h1>
          <div class="reputation-stars" id="reputationStars"></div>
        </div>
      </div>
    </div>

    <!-- STATS CARDS -->
    <div class="stats-row" id="statsRow">
      <div class="card card-stat">
        <div class="stat-icon stat-icon--green"><i class="fas fa-box-open"></i></div>
        <div class="stat-info">
          <span class="stat-value" id="statMyItems">—</span>
          <span class="stat-label">Meus itens</span>
        </div>
      </div>
      <div class="card card-stat">
        <div class="stat-icon stat-icon--amber"><i class="fas fa-bell"></i></div>
        <div class="stat-info">
          <span class="stat-value" id="statProposals">—</span>
          <span class="stat-label">Propostas recebidas</span>
        </div>
      </div>
      <div class="card card-stat">
        <div class="stat-icon stat-icon--blue"><i class="fas fa-check-circle"></i></div>
        <div class="stat-info">
          <span class="stat-value" id="statDone">—</span>
          <span class="stat-label">Trocas concluídas</span>
        </div>
      </div>
    </div>

    <!-- FEED RECENTE -->
    <section class="dashboard-section">
      <div class="section-title-row">
        <h2><i class="fas fa-clock"></i> Itens recentes no catálogo</h2>
        <a href="catalog.html" class="btn btn-secondary btn-sm">Ver todos</a>
      </div>
      <div class="grid-3" id="recentItems">
        <div class="loading-spinner-wrap"><div class="loading-spinner"></div></div>
      </div>
    </section>

  </main>

  <!-- FAB -->
  <a href="my-items.html" class="fab" title="Adicionar item">
    <i class="fas fa-plus"></i>
  </a>

  <script>
    const API_BASE = 'http://localhost:3001/api';
    function getToken() { return localStorage.getItem('ecopermuta_token'); }
    function authHeaders() { return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }; }

    // Auth guard
    if (!getToken()) window.location.href = 'login.html';

    document.getElementById('navToggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('open');
    });

    function logout() {
      localStorage.removeItem('ecopermuta_token');
      localStorage.removeItem('ecopermuta_user');
      window.location.href = 'login.html';
    }

    function renderStars(rep) {
      const full = Math.min(Math.floor(rep / 20), 5);
      let html = '';
      for (let i = 0; i < 5; i++) {
        html += `<i class="fa${i < full ? 's' : 'r'} fa-star"></i>`;
      }
      return html;
    }

    function renderItemCard(item) {
      const imgs = item.images ? JSON.parse(item.images) : [];
      const imgSrc = imgs.length ? imgs[0] : 'https://via.placeholder.com/300x200?text=Sem+imagem';
      return `
        <div class="card card-item fade-in">
          <div class="card-item-img">
            <img src="${imgSrc}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x200?text=Sem+imagem'">
          </div>
          <div class="card-item-body">
            <span class="badge badge-category">${item.category || 'Geral'}</span>
            <h3 class="card-item-title">${item.title}</h3>
            <p class="card-item-owner"><i class="fas fa-user"></i> ${item.owner_name || 'Usuário'}</p>
            <a href="item-detail.html?id=${item.id}" class="btn btn-primary btn-sm btn-full mt-1">Ver detalhes</a>
          </div>
        </div>
      `;
    }

    async function loadDashboard() {
      // Carregar dados do usuário
      try {
        const cached = localStorage.getItem('ecopermuta_user');
        if (cached) {
          const u = JSON.parse(cached);
          document.getElementById('userName').textContent = u.name ? u.name.split(' ')[0] : 'Usuário';
          document.getElementById('reputationStars').innerHTML = renderStars(u.reputation || 0);
          if (u.avatar_url) {
            document.getElementById('userAvatar').innerHTML = `<img src="${u.avatar_url}" alt="avatar">`;
          }
        }

        const meRes = await fetch(`${API_BASE}/auth/me`, { headers: authHeaders() });
        if (meRes.ok) {
          const me = await meRes.json();
          localStorage.setItem('ecopermuta_user', JSON.stringify(me));
          document.getElementById('userName').textContent = me.name ? me.name.split(' ')[0] : 'Usuário';
          document.getElementById('reputationStars').innerHTML = renderStars(me.reputation || 0);
        }
      } catch(e) {}

      // Meus itens
      try {
        const myItems = await fetch(`${API_BASE}/items/user/my`, { headers: authHeaders() });
        if (myItems.ok) {
          const data = await myItems.json();
          document.getElementById('statMyItems').textContent = data.length;
        }
      } catch(e) { document.getElementById('statMyItems').textContent = '0'; }

      // Trocas
      try {
        const tradesRes = await fetch(`${API_BASE}/trades`, { headers: authHeaders() });
        if (tradesRes.ok) {
          const trades = await tradesRes.json();
          const received = trades.filter(t => t.owner_id == getCurrentUserId() && t.status === 'pending');
          const done = trades.filter(t => t.status === 'completed');
          document.getElementById('statProposals').textContent = received.length;
          document.getElementById('statDone').textContent = done.length;
        }
      } catch(e) {
        document.getElementById('statProposals').textContent = '0';
        document.getElementById('statDone').textContent = '0';
      }

      // Itens recentes
      try {
        const itemsRes = await fetch(`${API_BASE}/items`);
        if (itemsRes.ok) {
          const items = await itemsRes.json();
          const recent = items.slice(0, 6);
          if (recent.length === 0) {
            document.getElementById('recentItems').innerHTML = '<p class="text-muted">Nenhum item disponível ainda. <a href="my-items.html">Adicione o primeiro!</a></p>';
          } else {
            document.getElementById('recentItems').innerHTML = recent.map(renderItemCard).join('');
          }
        }
      } catch(e) {
        document.getElementById('recentItems').innerHTML = '<p class="text-muted">Erro ao carregar itens.</p>';
      }
    }

    function getCurrentUserId() {
      try {
        const u = JSON.parse(localStorage.getItem('ecopermuta_user'));
        return u ? u.id : null;
      } catch(e) { return null; }
    }

    loadDashboard();
  </script>
</body>
</html>
