<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Itens — EcoPermuta</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="navbar-logo"><i class="fas fa-leaf"></i> EcoPermuta</a>
      <button class="navbar-toggle" id="navToggle"><i class="fas fa-bars"></i></button>
      <ul class="navbar-links" id="navLinks">
        <li><a href="catalog.html"><i class="fas fa-th"></i> Catálogo</a></li>
        <li><a href="map.html"><i class="fas fa-map-marker-alt"></i> Mapa</a></li>
        <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="trades.html"><i class="fas fa-handshake"></i> Trocas</a></li>
        <li><a href="#" onclick="logout()" class="btn btn-secondary btn-sm">Sair</a></li>
      </ul>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1><i class="fas fa-box-open"></i> Meus Itens</h1>
      <p>Gerencie os itens que você deseja trocar</p>
    </div>
  </div>

  <main class="container my-items-main">
    <div class="my-items-toolbar">
      <span id="itemCount" class="text-muted"></span>
      <button class="btn btn-primary" onclick="openAddModal()">
        <i class="fas fa-plus"></i> Adicionar item
      </button>
    </div>

    <div class="grid-3" id="myItemsGrid">
      <div class="loading-spinner-wrap"><div class="loading-spinner"></div></div>
    </div>
  </main>

  <!-- FAB -->
  <button class="fab" onclick="openAddModal()" title="Adicionar item">
    <i class="fas fa-plus"></i>
  </button>

  <!-- MODAL ADICIONAR/EDITAR ITEM -->
  <div class="modal-overlay" id="itemModal" style="display:none;">
    <div class="modal modal--wide">
      <div class="modal-header">
        <h2 id="modalTitle"><i class="fas fa-box-open"></i> Novo Item</h2>
        <button class="modal-close" onclick="closeItemModal()"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editItemId">
        <div class="grid-2">
          <div class="form-group">
            <label>Título *</label>
            <input type="text" id="iTitle" class="form-control" placeholder="Nome do item" required>
          </div>
          <div class="form-group">
            <label>Categoria *</label>
            <select id="iCategory" class="form-control">
              <option value="">Selecione...</option>
              <option>Livros</option><option>Roupas</option><option>Ferramentas</option>
              <option>Jogos</option><option>Plantas</option><option>Eletrônicos</option><option>Outros</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Descrição</label>
          <textarea id="iDescription" class="form-control" rows="3" placeholder="Descreva o estado, tamanho, etc..."></textarea>
        </div>
        <div class="form-group">
          <label>Condição *</label>
          <select id="iCondition" class="form-control">
            <option value="">Selecione...</option>
            <option>Novo</option><option>Ótimo</option><option>Bom</option><option>Regular</option>
          </select>
        </div>
        <div class="form-group">
          <label>URLs das imagens <span class="text-muted">(uma por linha)</span></label>
          <textarea id="iImages" class="form-control" rows="3" placeholder="https://exemplo.com/foto1.jpg&#10;https://exemplo.com/foto2.jpg"></textarea>
        </div>
        <div class="form-group">
          <label><i class="fas fa-map-marker-alt"></i> Localização</label>
          <input type="text" id="iLocationName" class="form-control" placeholder="Nome do local (ex: Pinheiros, SP)" style="margin-bottom:8px;">
          <div class="grid-2">
            <input type="number" id="iLat" class="form-control" placeholder="Latitude" step="any">
            <input type="number" id="iLng" class="form-control" placeholder="Longitude" step="any">
          </div>
          <button type="button" class="btn btn-secondary btn-sm mt-1" onclick="useMyLocation()">
            <i class="fas fa-crosshairs"></i> Usar minha localização
          </button>
          <span id="locationStatus" class="text-muted" style="font-size:0.85rem; margin-left:8px;"></span>
        </div>
        <div id="itemModalError" class="form-error" style="display:none;"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeItemModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="saveItem()">
            <span id="saveBtnText"><i class="fas fa-save"></i> Salvar</span>
            <span id="saveBtnLoading" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Salvando...</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3001/api';
    function getToken() { return localStorage.getItem('ecopermuta_token'); }
    function authHeaders() { return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }; }

    if (!getToken()) window.location.href = 'login.html';

    document.getElementById('navToggle').addEventListener('click', () => { document.getElementById('navLinks').classList.toggle('open'); });
    function logout() { localStorage.removeItem('ecopermuta_token'); localStorage.removeItem('ecopermuta_user'); window.location.href = 'login.html'; }

    let myItems = [];

    function getStatusBadge(status) {
      const map = {
        'available': '<span class="badge badge-status--available">Disponível</span>',
        'in_trade': '<span class="badge badge-status--trade">Em troca</span>',
        'traded': '<span class="badge badge-status--traded">Trocado</span>'
      };
      return map[status] || `<span class="badge">${status}</span>`;
    }

    function renderMyItems() {
      const grid = document.getElementById('myItemsGrid');
      document.getElementById('itemCount').textContent = `${myItems.length} item${myItems.length !== 1 ? 's' : ''}`;

      if (myItems.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <i class="fas fa-box-open fa-3x"></i>
            <h3>Nenhum item ainda</h3>
            <p>Adicione seu primeiro item para começar a trocar!</p>
            <button class="btn btn-primary" onclick="openAddModal()"><i class="fas fa-plus"></i> Adicionar item</button>
          </div>`;
        return;
      }

      grid.innerHTML = myItems.map(item => {
        let imgs = [];
        try { imgs = JSON.parse(item.images || '[]'); } catch(e) {}
        const imgSrc = imgs[0] || 'https://via.placeholder.com/300x200?text=Sem+imagem';
        return `
          <div class="card card-item fade-in">
            <div class="card-item-img">
              <img src="${imgSrc}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x200?text=x'">
              ${getStatusBadge(item.status)}
            </div>
            <div class="card-item-body">
              <span class="badge badge-category">${item.category || 'Geral'}</span>
              <h3 class="card-item-title">${item.title}</h3>
              <p class="card-item-desc">${(item.description||'').substring(0,70)}${item.description&&item.description.length>70?'...':''}</p>
              <div class="card-item-actions mt-1">
                <a href="item-detail.html?id=${item.id}" class="btn btn-secondary btn-sm"><i class="fas fa-eye"></i></a>
                <button class="btn btn-secondary btn-sm" onclick="openEditModal(${item.id})"><i class="fas fa-edit"></i></button>
                <button class="btn btn-danger btn-sm" onclick="deleteItem(${item.id})"><i class="fas fa-trash"></i></button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadMyItems() {
      try {
        const res = await fetch(`${API_BASE}/items/user/my`, { headers: authHeaders() });
        if (res.ok) { myItems = await res.json(); }
        else { myItems = []; }
      } catch(e) { myItems = []; }
      renderMyItems();
    }

    function openAddModal() {
      document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus"></i> Novo Item';
      document.getElementById('editItemId').value = '';
      ['iTitle','iCategory','iDescription','iCondition','iImages','iLocationName','iLat','iLng'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.getElementById('itemModalError').style.display = 'none';
      document.getElementById('itemModal').style.display = 'flex';
    }

    function openEditModal(id) {
      const item = myItems.find(i => i.id === id);
      if (!item) return;
      document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> Editar Item';
      document.getElementById('editItemId').value = id;
      document.getElementById('iTitle').value = item.title || '';
      document.getElementById('iCategory').value = item.category || '';
      document.getElementById('iDescription').value = item.description || '';
      document.getElementById('iCondition').value = item.condition || '';
      let imgs = [];
      try { imgs = JSON.parse(item.images || '[]'); } catch(e) {}
      document.getElementById('iImages').value = imgs.join('\n');
      document.getElementById('iLocationName').value = item.location_name || '';
      document.getElementById('iLat').value = item.latitude || '';
      document.getElementById('iLng').value = item.longitude || '';
      document.getElementById('itemModalError').style.display = 'none';
      document.getElementById('itemModal').style.display = 'flex';
    }

    function closeItemModal() { document.getElementById('itemModal').style.display = 'none'; }
    document.getElementById('itemModal').addEventListener('click', (e) => { if(e.target === document.getElementById('itemModal')) closeItemModal(); });

    function useMyLocation() {
      const status = document.getElementById('locationStatus');
      status.textContent = 'Obtendo localização...';
      if (!navigator.geolocation) { status.textContent = 'Geolocalização não suportada.'; return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          document.getElementById('iLat').value = pos.coords.latitude.toFixed(6);
          document.getElementById('iLng').value = pos.coords.longitude.toFixed(6);
          status.textContent = '✓ Localização obtida!';
          setTimeout(() => status.textContent = '', 3000);
        },
        () => { status.textContent = 'Não foi possível obter localização.'; }
      );
    }

    async function saveItem() {
      const editId = document.getElementById('editItemId').value;
      const title = document.getElementById('iTitle').value.trim();
      const category = document.getElementById('iCategory').value;
      const description = document.getElementById('iDescription').value.trim();
      const condition = document.getElementById('iCondition').value;
      const imagesRaw = document.getElementById('iImages').value.trim();
      const location_name = document.getElementById('iLocationName').value.trim();
      const latitude = parseFloat(document.getElementById('iLat').value) || null;
      const longitude = parseFloat(document.getElementById('iLng').value) || null;

      const errEl = document.getElementById('itemModalError');
      errEl.style.display = 'none';

      if (!title) { errEl.textContent = 'Título é obrigatório.'; errEl.style.display='block'; return; }

      const images = imagesRaw ? imagesRaw.split('\n').map(s=>s.trim()).filter(Boolean) : [];
      const body = { title, category, description, condition, images, location_name, latitude, longitude };

      document.getElementById('saveBtnText').style.display = 'none';
      document.getElementById('saveBtnLoading').style.display = 'inline';

      try {
        const url = editId ? `${API_BASE}/items/${editId}` : `${API_BASE}/items`;
        const method = editId ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers: authHeaders(), body: JSON.stringify(body) });
        const data = await res.json();

        if (res.ok) {
          closeItemModal();
          loadMyItems();
        } else {
          errEl.textContent = data.error || 'Erro ao salvar item.';
          errEl.style.display = 'block';
        }
      } catch(e) {
        errEl.textContent = 'Erro de conexão.';
        errEl.style.display = 'block';
      }

      document.getElementById('saveBtnText').style.display = 'inline';
      document.getElementById('saveBtnLoading').style.display = 'none';
    }

    async function deleteItem(id) {
      if (!confirm('Deletar este item? Esta ação não pode ser desfeita.')) return;
      try {
        const res = await fetch(`${API_BASE}/items/${id}`, { method: 'DELETE', headers: authHeaders() });
        if (res.ok) loadMyItems();
        else alert('Erro ao deletar item.');
      } catch(e) { alert('Erro de conexão.'); }
    }

    loadMyItems();
  </script>
</body>
</html>
