<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Itens — Scamb</title>
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/navigation.js" defer></script>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" aria-label="Navegação principal">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">
        <span class="swap-mark" aria-hidden="true"></span>Scamb
      </a>
      <button type="button" class="navbar-toggle" id="navToggle" aria-label="Menu" aria-controls="navLinks" aria-expanded="false">
        <span class="menu-lines" aria-hidden="true"></span>
      </button>
      <ul class="navbar-links" id="navLinks">
        <li><a href="catalog.html"><i class="fas fa-th-large"></i> Catálogo</a></li>
        <li><a href="map.html"><i class="fas fa-map-marker-alt"></i> Pontos seguros</a></li>
        <li><a href="dashboard.html"><i class="fas fa-columns"></i> Painel</a></li>
        <li><a href="my-items.html" class="active"><i class="fas fa-box-open"></i> Meus itens</a></li>
        <li><a href="trades.html"><i class="fas fa-handshake"></i> Trocas</a></li>
        <li><a href="profile.html"><i class="fas fa-user-circle"></i> Perfil</a></li>
        <li><a href="#" onclick="logout()" class="btn btn-secondary btn-sm">Sair</a></li>
      </ul>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1><i class="fas fa-box-open"></i> Meus Itens</h1>
      <p>Gerencie os itens que você deseja trocar</p>
    </div>
  </div>

  <main class="container my-items-main">
    <div class="my-items-toolbar">
      <span id="itemCount" class="text-muted"></span>
      <button class="btn btn-primary" onclick="openAddModal()">
        <i class="fas fa-plus"></i> Adicionar item
      </button>
    </div>

    <div class="grid-3" id="myItemsGrid">
      <div class="loading-spinner-wrap"><div class="loading-spinner"></div></div>
    </div>
  </main>

  <!-- MODAL ADICIONAR/EDITAR ITEM (100% RESPONSIVO & ROLÁVEL COM BOTÕES FIXOS) -->
  <div class="modal-overlay" id="itemModal" style="display:none;">
    <div class="modal modal--wide">
      <div class="modal-header">
        <h2 id="modalTitle"><i class="fas fa-box-open" style="color:var(--color-primary);"></i> Novo Item</h2>
        <button type="button" class="modal-close" onclick="closeItemModal()" aria-label="Fechar"><i class="fas fa-times"></i></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="editItemId">
        
        <!-- Linha 1: Título e Categoria -->
        <div class="grid-2" style="margin-bottom:14px;">
          <div class="form-group" style="margin-bottom:0;">
            <label for="iTitle">Título do Anúncio *</label>
            <input type="text" id="iTitle" class="form-control" placeholder="Ex: Zelda Tears of the Kingdom" required>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label for="iCategory">Categoria *</label>
            <select id="iCategory" class="form-control">
              <option value="">Selecione...</option>
              <option>Livros</option><option>Roupas</option><option>Ferramentas</option>
              <option>Jogos</option><option>Plantas</option><option>Eletrônicos</option><option>Outros</option>
            </select>
          </div>
        </div>

        <!-- Linha 2: Condição e Localização Nome -->
        <div class="grid-2" style="margin-bottom:14px;">
          <div class="form-group" style="margin-bottom:0;">
            <label for="iCondition">Condição *</label>
            <select id="iCondition" class="form-control">
              <option value="">Selecione...</option>
              <option>Novo</option><option>Ótimo</option><option>Bom</option><option>Regular</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label for="iLocationName"><i class="fas fa-map-marker-alt" style="color:var(--color-primary);"></i> Bairro / Cidade</label>
            <input type="text" id="iLocationName" class="form-control" placeholder="Ex: Pinheiros, São Paulo">
          </div>
        </div>

        <!-- Linha 3: Descrição -->
        <div class="form-group" style="margin-bottom:14px;">
          <label for="iDescription">Descrição do Item</label>
          <textarea id="iDescription" class="form-control" rows="2" placeholder="Descreva o estado de conservação, detalhes técnicos, edições..."></textarea>
        </div>

        <!-- Linha 4: Fotos do Item -->
        <div class="form-group" style="margin-bottom:14px;">
          <label style="display:flex; justify-content:space-between; align-items:center;">
            <span><i class="fas fa-camera" style="color:var(--color-primary);"></i> Fotos do item</span>
            <span id="fileCountNotice" class="text-muted" style="font-size:0.8rem; font-weight:500;"></span>
          </label>
          <div style="display:flex; align-items:center; gap:10px; margin-top:4px; flex-wrap:wrap;">
            <label class="btn btn-secondary btn-sm" style="cursor:pointer; margin:0; display:inline-flex; align-items:center; gap:6px;">
              <i class="fas fa-folder-open"></i> Selecionar fotos do computador
              <input type="file" id="itemFileInput" multiple accept="image/*" style="display:none;" onchange="handleItemFiles(event)">
            </label>
            <span style="font-size:0.8rem; color:#64748b;">(Upload direto de arquivos)</span>
          </div>
          <div id="itemPhotoPreviews" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;"></div>
          <div style="margin-top:8px;">
            <input type="text" id="iImages" class="form-control" placeholder="Ou cole a URL direta de uma foto (opcional)" style="font-size:0.85rem; padding:8px 12px;">
          </div>
        </div>

        <!-- Linha 5: Coordenadas GPS (Opcional) -->
        <div style="background:#f8faff; border:1px solid var(--color-border); border-radius:var(--radius-sm); padding:12px 16px; margin-bottom:14px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
            <label style="font-size:0.82rem; font-weight:700; color:#475569; margin:0;">
              <i class="fas fa-satellite" style="color:var(--color-accent);"></i> Coordenadas de Referência GPS (Opcional)
            </label>
            <button type="button" class="btn btn-secondary btn-sm" onclick="useMyLocation()" style="padding:4px 10px; font-size:0.78rem;">
              <i class="fas fa-crosshairs"></i> Obter meu GPS
            </button>
          </div>
          <div class="grid-2" style="gap:10px;">
            <input type="number" id="iLat" class="form-control" placeholder="Latitude (ex: -23.56)" step="any" style="font-size:0.85rem; padding:6px 10px;">
            <input type="number" id="iLng" class="form-control" placeholder="Longitude (ex: -46.65)" step="any" style="font-size:0.85rem; padding:6px 10px;">
          </div>
          <span id="locationStatus" class="text-muted" style="font-size:0.78rem; display:block; margin-top:4px;"></span>
        </div>

        <div id="itemModalError" class="form-error" style="display:none; margin-bottom:12px;"></div>
      </div>

      <!-- FOOTER FIXO (SEMPRE VISÍVEL E CLICÁVEL) -->
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeItemModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="saveItem()">
          <span id="saveBtnText"><i class="fas fa-save"></i> Salvar Item</span>
          <span id="saveBtnLoading" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Salvando...</span>
        </button>
      </div>

    </div>
  </div>

  <script>
    const API_BASE = location.protocol === 'file:' ? 'http://localhost:3001/api' : '/api';
    function getToken() { return localStorage.getItem('scamb_token') || localStorage.getItem('swaply_token') || localStorage.getItem('ecotroca_token') || localStorage.getItem('ecopermuta_token'); }
    function authHeaders() { return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }; }

    if (!getToken()) window.location.href = 'login.html';

    function logout() { 
      localStorage.removeItem('scamb_token'); 
      localStorage.removeItem('scamb_user');
      localStorage.removeItem('swaply_token'); 
      localStorage.removeItem('swaply_user');
      localStorage.removeItem('ecotroca_token'); 
      localStorage.removeItem('ecotroca_user'); 
      localStorage.removeItem('ecopermuta_token'); 
      localStorage.removeItem('ecopermuta_user'); 
      window.location.href = 'login.html'; 
    }

    let myItems = [];

    function getEffectiveStatus(item) {
      return item.effective_status || item.status || 'available';
    }

    function getStatusBadge(status) {
      const map = {
        'available': '<span class="badge badge-status--available"><i class="fas fa-check-circle" aria-hidden="true"></i> Disponível</span>',
        'in_trade': '<span class="badge badge-status--trade"><i class="fas fa-handshake" aria-hidden="true"></i> Em negociação para troca</span>',
        'traded': '<span class="badge badge-status--traded"><i class="fas fa-ban" aria-hidden="true"></i> Item trocado · Indisponível</span>'
      };
      return map[status] || `<span class="badge badge-status">${status}</span>`;
    }

    const DEFAULT_IMG = "data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27400%27 height=%27300%27 viewBox=%270 0 400 300%27%3E%3Crect width=%27400%27 height=%27300%27 fill=%27%23edf3e6%27/%3E%3Ccircle cx=%27200%27 cy=%27140%27 r=%2745%27 fill=%27%23365941%27 opacity=%270.7%27/%3E%3Ctext x=%27200%27 y=%27230%27 font-family=%27sans-serif%27 font-size=%2716%27 fill=%27%23365941%27 font-weight=%27bold%27 text-anchor=%27middle%27%3EScamb%3C/text%3E%3C/svg%3E";

    let selectedUploadedFiles = [];

    function getItemImages(item) {
      if (Array.isArray(item.images)) return item.images;
      if (typeof item.images === 'string') {
        try {
          const parsed = JSON.parse(item.images);
          if (Array.isArray(parsed)) return parsed;
          return [item.images];
        } catch(e) {
          return [item.images];
        }
      }
      return [];
    }

    function handleItemFiles(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      selectedUploadedFiles = files;
      document.getElementById('fileCountNotice').textContent = `${files.length} foto(s) selecionada(s)`;
      const previewContainer = document.getElementById('itemPhotoPreviews');
      previewContainer.innerHTML = '';

      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const thumb = document.createElement('div');
          thumb.style.cssText = 'width:60px; height:60px; border-radius:6px; overflow:hidden; border:2px solid #2D7D32;';
          thumb.innerHTML = `<img src="${ev.target.result}" style="width:100%; height:100%; object-fit:cover;">`;
          previewContainer.appendChild(thumb);
        };
        reader.readAsDataURL(file);
      });
    }

    function renderMyItems() {
      const grid = document.getElementById('myItemsGrid');
      document.getElementById('itemCount').textContent = `${myItems.length} item${myItems.length !== 1 ? 's' : ''}`;

      if (myItems.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <i class="fas fa-box-open fa-3x"></i>
            <h3>Nenhum item ainda</h3>
            <p>Adicione seu primeiro item para começar a trocar!</p>
            <button class="btn btn-primary" onclick="openAddModal()"><i class="fas fa-plus"></i> Adicionar item</button>
          </div>`;
        return;
      }

      grid.innerHTML = myItems.map(item => {
        const imgs = getItemImages(item);
        const imgSrc = imgs.length && imgs[0] ? imgs[0] : DEFAULT_IMG;
        const st = getEffectiveStatus(item);
        const statusNote = st === 'traded'
          ? '<div class="card-item-status-note card-item-status-note--traded"><i class="fas fa-ban" aria-hidden="true"></i> Item trocado · Não está mais disponível</div>'
          : (st === 'in_trade'
            ? '<div class="card-item-status-note card-item-status-note--trade"><i class="fas fa-handshake" aria-hidden="true"></i> Em negociação para troca</div>'
            : '');
        return `
          <div class="card card-item ${st === 'traded' ? 'card-item--traded' : ''} fade-in">
            <div class="card-item-img">
              <img src="${imgSrc}" alt="${item.title}" onerror="this.onerror=null; this.src='${DEFAULT_IMG}'">
              ${getStatusBadge(st)}
            </div>
            <div class="card-item-body">
              <span class="badge badge-category">${item.category || 'Geral'}</span>
              <h3 class="card-item-title">${item.title}</h3>
              ${statusNote}
              <p class="card-item-desc">${(item.description||'').substring(0,70)}${item.description&&item.description.length>70?'...':''}</p>
              <div class="card-item-actions mt-1">
                <a href="item-detail.html?id=${item.id}" class="btn btn-secondary btn-sm"><i class="fas scamb-icon fa-eye"></i></a>
                <button class="btn btn-secondary btn-sm" onclick="openEditModal(${item.id})"><i class="fas fa-edit"></i></button>
                <button class="btn btn-danger btn-sm" onclick="deleteItem(${item.id})"><i class="fas fa-trash"></i></button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadMyItems() {
      try {
        const res = await fetch(`${API_BASE}/items/user/my`, { headers: authHeaders() });
        if (res.ok) {
          const data = await res.json();
          myItems = Array.isArray(data) ? data : (data.data || []);
        } else {
          myItems = [];
        }
      } catch(e) { myItems = []; }
      renderMyItems();
    }

    function openAddModal() {
      selectedUploadedFiles = [];
      document.getElementById('fileCountNotice').textContent = '';
      document.getElementById('itemPhotoPreviews').innerHTML = '';
      document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus"></i> Novo Item';
      document.getElementById('editItemId').value = '';
      ['iTitle','iCategory','iDescription','iCondition','iImages','iLocationName','iLat','iLng'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.getElementById('itemModalError').style.display = 'none';
      const m = document.getElementById('itemModal');
      m.style.display = 'flex';
      m.classList.add('open');
      m.classList.add('active');
    }

    function openEditModal(id) {
      selectedUploadedFiles = [];
      document.getElementById('fileCountNotice').textContent = '';
      document.getElementById('itemPhotoPreviews').innerHTML = '';
      const item = myItems.find(i => i.id === id);
      if (!item) return;
      document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> Editar Item';
      document.getElementById('editItemId').value = id;
      document.getElementById('iTitle').value = item.title || '';
      document.getElementById('iCategory').value = item.category || '';
      document.getElementById('iDescription').value = item.description || '';
      document.getElementById('iCondition').value = item.condition || '';
      const imgs = getItemImages(item);
      document.getElementById('iImages').value = imgs.join('\n');
      document.getElementById('iLocationName').value = item.location_name || '';
      document.getElementById('iLat').value = item.latitude || '';
      document.getElementById('iLng').value = item.longitude || '';
      document.getElementById('itemModalError').style.display = 'none';
      const m = document.getElementById('itemModal');
      m.style.display = 'flex';
      m.classList.add('open');
      m.classList.add('active');
    }

    function closeItemModal() {
      const m = document.getElementById('itemModal');
      m.style.display = 'none';
      m.classList.remove('open');
      m.classList.remove('active');
    }
    document.getElementById('itemModal').addEventListener('click', (e) => {
      if(e.target === document.getElementById('itemModal')) closeItemModal();
    });

    function useMyLocation() {
      const status = document.getElementById('locationStatus');
      status.textContent = 'Obtendo localização...';
      if (!navigator.geolocation) { status.textContent = 'Geolocalização não suportada.'; return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          document.getElementById('iLat').value = pos.coords.latitude.toFixed(6);
          document.getElementById('iLng').value = pos.coords.longitude.toFixed(6);
          status.textContent = '✓ Localização obtida!';
          setTimeout(() => status.textContent = '', 3000);
        },
        () => { status.textContent = 'Não foi possível obter localização.'; }
      );
    }

    async function saveItem() {
      const editId = document.getElementById('editItemId').value;
      const title = document.getElementById('iTitle').value.trim();
      const category = document.getElementById('iCategory').value;
      const description = document.getElementById('iDescription').value.trim();
      const condition = document.getElementById('iCondition').value;
      const imagesRaw = document.getElementById('iImages').value.trim();
      const location_name = document.getElementById('iLocationName').value.trim();
      const latitude = parseFloat(document.getElementById('iLat').value) || null;
      const longitude = parseFloat(document.getElementById('iLng').value) || null;

      const errEl = document.getElementById('itemModalError');
      errEl.style.display = 'none';

      if (!title) { errEl.textContent = 'Título é obrigatório.'; errEl.style.display='block'; return; }

      document.getElementById('saveBtnText').style.display = 'none';
      document.getElementById('saveBtnLoading').style.display = 'inline';

      try {
        let uploadedUrls = [];
        if (selectedUploadedFiles.length > 0) {
          const formData = new FormData();
          selectedUploadedFiles.forEach(f => formData.append('images', f));
          const upRes = await fetch(`${API_BASE}/items/upload`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + getToken() },
            body: formData
          });
          if (upRes.ok) {
            const upData = await upRes.json();
            if (upData.urls) uploadedUrls = upData.urls;
          }
        }

        const rawUrls = imagesRaw ? imagesRaw.split('\n').map(s=>s.trim()).filter(Boolean) : [];
        const images = [...uploadedUrls, ...rawUrls];
        const body = { title, category, description, condition, images, location_name, latitude, longitude };

        const url = editId ? `${API_BASE}/items/${editId}` : `${API_BASE}/items`;
        const method = editId ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers: authHeaders(), body: JSON.stringify(body) });
        const data = await res.json();

        if (res.ok) {
          closeItemModal();
          loadMyItems();
        } else {
          errEl.textContent = data.error || 'Erro ao salvar item.';
          errEl.style.display = 'block';
        }
      } catch(e) {
        errEl.textContent = 'Erro de conexão com o servidor.';
        errEl.style.display = 'block';
      }

      document.getElementById('saveBtnText').style.display = 'inline';
      document.getElementById('saveBtnLoading').style.display = 'none';
    }

    async function deleteItem(id) {
      if (!confirm('Deletar este item? Esta ação não pode ser desfeita.')) return;
      try {
        const res = await fetch(`${API_BASE}/items/${id}`, { method: 'DELETE', headers: authHeaders() });
        if (res.ok) loadMyItems();
        else alert('Erro ao deletar item.');
      } catch(e) { alert('Erro de conexão.'); }
    }

    loadMyItems();
  </script>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container site-footer-inner">
      <a href="index.html" class="site-footer-brand"><span class="swap-mark" aria-hidden="true"></span>Scamb</a>
      <nav aria-label="Rodapé">
        <a href="catalog.html">Catálogo</a>
        <a href="map.html">Pontos seguros</a>
        <a href="trades.html">Trocas</a>
        <a href="profile.html">Perfil</a>
      </nav>
      <small>© 2026 Scamb · Feito por Felipe Gomes e José Adailton</small>
    </div>
  </footer>
</body>
</html>
